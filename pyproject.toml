[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-metadata-viewer"
version = "1.0.0"
description = "Python image metadata and EXIF/GPS inspector with non-destructive metadata scrubbing using Pillow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
